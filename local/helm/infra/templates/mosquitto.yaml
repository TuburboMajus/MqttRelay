apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-mosquitto-config
data:
  mosquitto.conf: |
    # Local-only: anonymous access, no TLS. Never reuse outside local dev.
    listener 1883
    allow_anonymous true
    persistence false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mosquitto
  labels:
    app.kubernetes.io/name: mqttrelay-local-mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mqttrelay-local-mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mqttrelay-local-mosquitto
    spec:
      containers:
        - name: mosquitto
          image: {{ .Values.mosquitto.image }}
          ports:
            - containerPort: 1883
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-mosquitto-config
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  labels:
    app.kubernetes.io/name: mqttrelay-local-mosquitto
spec:
  selector:
    app.kubernetes.io/name: mqttrelay-local-mosquitto
  ports:
    - port: 1883
      targetPort: 1883
