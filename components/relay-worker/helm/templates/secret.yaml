apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-relay-worker-secrets
  labels:
    app.kubernetes.io/name: mqttrelay-relay-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  MQTT_RELAY_ENC_KEY_PRIMARY: {{ .Values.secrets.encKeyPrimary | quote }}
