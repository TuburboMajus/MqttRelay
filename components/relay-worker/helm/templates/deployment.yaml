apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-relay-worker
  labels:
    app.kubernetes.io/name: mqttrelay-relay-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mqttrelay-relay-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mqttrelay-relay-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: relay-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DB_HOST
              value: {{ .Values.env.dbHost | quote }}
            - name: DB_PORT
              value: {{ .Values.env.dbPort | quote }}
            - name: DB_NAME
              value: {{ .Values.env.dbName | quote }}
            - name: DB_USER
              value: {{ .Values.env.dbUser | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-relay-worker-secrets
                  key: DB_PASSWORD
            - name: MQTT_RELAY_ENC_KEY_PRIMARY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-relay-worker-secrets
                  key: MQTT_RELAY_ENC_KEY_PRIMARY
          {{- if .Values.parsersClaimName }}
          volumeMounts:
            - name: parsers
              mountPath: /app/db
          {{- end }}
      {{- if .Values.parsersClaimName }}
      volumes:
        - name: parsers
          persistentVolumeClaim:
            claimName: {{ .Values.parsersClaimName }}
      {{- end }}
