replicaCount: 1

image:
  repository: mqttrelay-dashboard
  tag: local
  pullPolicy: IfNotPresent

service:
  port: 23909

env:
  appProd: "true"
  appHost: "0.0.0.0"
  appPort: "23909"
  appThreaded: "true"
  appDebug: "false"
  appLogLevel: "INFO"
  defaultLanguage: "fr"
  mqttBrokerUrl: "mosquitto"
  mqttBrokerPort: "1883"
  dbHost: "postgres"
  dbPort: "5432"
  dbName: "mqttrelay"
  dbUser: "mqttrelay"

# Real secrets — never commit real values here. Pass with
# `helm install -f local/.secrets/creds.values.yaml` or `--set secrets.xxx=...`.
secrets:
  dbPassword: ""
  mqttPassword: ""
  encKeyPrimary: ""
  appSecretKey: ""

# Name of a pre-existing ReadWriteMany PVC shared with relay-worker for db/parsers/.
# Left empty by default (minimal chart): the container boots without parser persistence
# until a real volume is wired up by whoever installs this chart.
parsersClaimName: ""
