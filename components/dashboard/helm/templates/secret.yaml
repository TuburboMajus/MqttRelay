apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-dashboard-secrets
  labels:
    app.kubernetes.io/name: mqttrelay-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  MQTT_PASSWORD: {{ .Values.secrets.mqttPassword | quote }}
  MQTT_RELAY_ENC_KEY_PRIMARY: {{ .Values.secrets.encKeyPrimary | quote }}
  APP_SECRET_KEY: {{ .Values.secrets.appSecretKey | quote }}
