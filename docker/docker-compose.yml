# ---------------------------------------------------------------------------
# MqttRelay — local deployment of the Flask dashboard (and optional worker/DB).
#
# Run from the repository root:
#   cp docker/.env.example .env # fill in DB / MQTT credentials
#   docker compose --project-directory . -f docker/docker-compose.yml up -d --build
#
# The container generates /app/config.toml from the `.env` variables on first
# start (when it is missing), so no config.toml is baked into the image or
# mounted. `--project-directory .` makes `docker compose` read the repo-root
# `.env` for variable interpolation (ports, etc.).
# ---------------------------------------------------------------------------

# Explicit project name: without it compose uses the directory name, which
# collides with any other project whose compose file lives in a docker/ folder.
name: mqttrelay

services:
  web:
    build:
      # Resolved against the project directory (repo root via --project-directory .)
      context: .
      dockerfile: docker/Dockerfile
    image: mqttrelay:latest
    container_name: mqttrelay-web
    restart: unless-stopped
    ports:
      - "${MQTTRELAY_PORT:-23909}:${APP_PORT:-23909}"
    # Inject the repo-root `.env` into the container (resolved via
    # `--project-directory .`). The entrypoint uses these variables to
    # generate /app/config.toml on first start.
    env_file:
      - .env
    volumes:
      # Parser source files written by the dashboard (persist across restarts).
      - parser_storage:/app/db
    # Lets containers reach a PostgreSQL running on the Docker host: set
    # DB_HOST=host.docker.internal in `.env`. Harmless when unused.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The ingest -> parse -> dispatch worker: a long-running loop (one cycle every
  # ~10s) guarded by the `job` DB lock, so it runs as a normal service.
  mqtt_transfer:
    build:
      # Same image as `web`; compose dedupes the build. Without a build section
      # compose would try to PULL mqttrelay:latest from a registry and fail.
      context: .
      dockerfile: docker/Dockerfile
    image: mqttrelay:latest
    container_name: mqttrelay-worker
    restart: unless-stopped
    depends_on:
      - web
    env_file:
      - .env
    volumes:
      # Shared with `web`: the worker imports parser code written by the dashboard.
      - parser_storage:/app/db
      - worker_logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "services/mqtt_transfer/mqtt_transfer_sqlalchemy.py", "--root-dir", "/app", "--logging-dir", "/app/logs"]

  # -------------------------------------------------------------------------
  # Optional: local PostgreSQL for development. If enabled, set DB_HOST=postgres
  # (and matching credentials) in `.env`.
  #
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DATABASE:-mqttrelay}
  #     POSTGRES_USER: ${POSTGRES_USER:-mqttrelay}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mqttrelay}
  #   volumes:
  #     - ../install/storages/dbscheme_postgresql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  #     - mqttrelay_postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  # -------------------------------------------------------------------------

volumes:
  parser_storage:
  worker_logs:
  # mqttrelay_postgres_data:
