htmlCopy code{% extends "/common/layouts/base.html" %}
{% block title %}Nouveau Client - MqttRelay{% endblock %}
{% block content %}
<h1 class="mb-4" style="margin-top: 50px;">Ajouter un nouveau client</h1>

<form method="POST" action="{{ url_for('clients.newClient') }}">
    <div class="mb-3">
        <label for="slug" class="form-label">Slug du client</label>
        <input 
            type="text" 
            class="form-control" 
            id="slug" 
            name="slug" 
            placeholder="unique-client-slug" 
            value="{{unused_slugs[0]}}"
            required 
            pattern="^[a-z0-9-]{1,64}$" 
            title="Lowercase letters, numbers, and hyphens only, max 64 characters"
            autofocus
        />
        <div class="form-text">Identifiant unique (lettres minuscules, chiffres, tirets, 64&nbsp;caractères max)</div>
    </div>
    <div class="mb-3">
        <label for="name" class="form-label">Nom du client</label>
        <input 
            type="text" 
            class="form-control" 
            id="name" 
            name="name" 
            placeholder="Enter client name" 
            required
        />
    </div>
    <div class="mb-3">
        <label for="contact_email" class="form-label">Email de contact (facultatif)</label>
        <input 
            type="email" 
            class="form-control" 
            id="contact_email" 
            name="contact_email" 
            placeholder="contact@example.com" 
        />
    </div>
    <div class="mb-3">
        <label for="status" class="form-label">Statut</label>
        <select class="form-select" id="status" name="status" required>
            <option value="active" selected>Actif</option>
            <option value="paused">En pause</option>
            <option value="disabled">Désactivé</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Ajouter le client</button>
</form>
{% endblock %}
