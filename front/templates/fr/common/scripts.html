htmlCopy code<script type="text/javascript">
  function formatRelativeTime(dom) {
    const raw = dom.dataset.time;
    const date = new Date(raw);
    if (isNaN(date.getTime())) {
      console.warn("Date invalide:", raw);
      return;
    }

    const now = new Date();
    const diffSec = Math.floor((now - date) / 1000);

    let text;
    if (diffSec >= 2 * 24 * 3600) {
      // Affiche la date complète
      text = dom.dataset.time;
    } else if (diffSec >= 24 * 3600) {
      text = "hier";
    } else if (diffSec >= 3600) {
      const h = Math.floor(diffSec / 3600);
      text = `Il y a ${h} heure${h > 1 ? "s" : ""}`;
    } else if (diffSec >= 60) {
      const m = Math.floor(diffSec / 60);
      text = `Il y a ${m} minute${m > 1 ? "s" : ""}`;
    } else {
      text = "Il y a moins d'une minute";
    }

    dom.textContent = text;
  }

  function refreshRelativeTimes() {
    document.querySelectorAll(".relative-time-displayer").forEach(formatRelativeTime);
  }

  // Initial format
  refreshRelativeTimes();

  // Mettre à jour toutes les 60s
  setInterval(refreshRelativeTimes, 60000);
</script>
