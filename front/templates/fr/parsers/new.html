jinjaCopy code<input id="name" name="name" class="form-control"
       value="{{ request.form.get('name','') }}"
       required placeholder="e.g., LSE01 Payload Parser"
       pattern="^[A-Za-z0-9 ]+$" maxlength="128" aria-describedby="nameHelp" />

<input id="version" name="version" class="form-control"
       value="{{ request.form.get('version','') }}"
       required placeholder="e.g., 1.0.0"
       pattern="^[0-9]+(\.[0-9]+){2}$" maxlength="32" aria-describedby="versionHelp" />

<select id="language" name="language" class="form-select">
  {% set sel_lang = request.form.get('language','') %}
  <option value="" {{ ''==sel_lang and 'selected' or '' }}>— Select —</option>
  {% for lang in ['python','javascript','sql','bash','go','rust'] %}
    <option value="{{ lang }}" {{ lang==sel_lang and 'selected' or '' }}>{{ lang|capitalize }}</option>
  {% endfor %}
</select>

<textarea id="description" name="description" class="form-control" rows="3" maxlength="512"
          placeholder="Short description...">{{ request.form.get('description','') }}</textarea>

<textarea id="config_schema" name="config_schema" class="form-control font-monospace" rows="10">{{ request.form.get('config_schema','') or
'{
  "type": "object",
  "properties": {
    "timezone": {"type": "string"},
    "scale": {"type": "number"},
    "offset": {"type": "number"},
    "topic_filter": {"type": "string"}
  },
  "additionalProperties": true
}' }}</textarea>

<input class="form-check-input" type="checkbox" id="active" name="active"
       {{ (request.form.get('active','on') in ['on','1','true']) and 'checked' or '' }}>
