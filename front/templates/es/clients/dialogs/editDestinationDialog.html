<!-- Ver / Editar Modal de Destino -->
<div class="modal fade" id="destinationDetailsModal" tabindex="-1" aria-labelledby="destinationDetailsLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="destinationDetailsLabel">Destino #<span id="vd_id"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <ul class="nav nav-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="vd-tab-details" data-bs-toggle="tab" data-bs-target="#vd-pane-details" type="button" role="tab">Detalles</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="vd-tab-edit" data-bs-toggle="tab" data-bs-target="#vd-pane-edit" type="button" role="tab">Editar</button>
          </li>
        </ul>

        <div class="tab-content pt-3">
          <!-- Detalles -->
          <div class="tab-pane fade show active" id="vd-pane-details" role="tabpanel" aria-labelledby="vd-tab-details">
            <div class="row g-3">
              <div class="col-md-6">
                <div><strong>Tipo:</strong> <span id="vd_type"></span></div>
                <div><strong>Objetivo:</strong> <span id="vd_target"></span></div>
                <div><strong>Activo:</strong> <span id="vd_active"></span></div>
                <div><strong>Creado:</strong> <span id="vd_created_at"></span></div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Opciones</label>
                <pre class="bg-light p-3 rounded small mb-0" id="vd_options" style="max-height: 240px; overflow:auto;">—</pre>
              </div>
            </div>
          </div>

          <!-- Editar -->
          <div class="tab-pane fade" id="vd-pane-edit" role="tabpanel" aria-labelledby="vd-tab-edit">
            <form id="editDestinationForm">
              <input type="hidden" id="vdf_id">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="vdf_type">Tipo</label>
                  <select id="vdf_type" class="form-select" required>
                    <option value="mysql">MySQL</option>
                    <option value="postgres">Postgres</option>
                    <option value="http">HTTP</option>
                    <option value="kafka">Kafka</option>
                    <option value="file">Archivo</option>
                    <option value="other">Otro</option>
                  </select>
                </div>

                <div class="col-md-6 d-flex align-items-end">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="vdf_active">
                    <label class="form-check-label" for="vdf_active">Activo</label>
                  </div>
                </div>

                <!-- Cluster de BD -->
                <div class="col-md-8 db-only-edit d-none">
                  <label class="form-label" for="vdf_host">Host</label>
                  <input id="vdf_host" class="form-control" placeholder="db.example.com">
                </div>
                <div class="col-md-4 db-only-edit d-none">
                  <label class="form-label" for="vdf_port">Puerto</label>
                  <input id="vdf_port" type="number" min="0" step="1" class="form-control" placeholder="5432">
                </div>
                <div class="col-md-6 db-only-edit d-none">
                  <label class="form-label" for="vdf_database_name">Base de datos</label>
                  <input id="vdf_database_name" class="form-control" placeholder="mydb">
                </div>
                <div class="col-md-6 db-only-edit d-none">
                  <label class="form-label" for="vdf_username">Usuario</label>
                  <input id="vdf_username" class="form-control" placeholder="dbuser">
                </div>
                <div class="col-md-6 db-only-edit d-none">
                  <label class="form-label" for="vdf_password">Contraseña</label>
                  <input id="vdf_password" type="password" class="form-control" placeholder="(dejar en blanco para mantener)">
                </div>

                <!-- URI -->
                <div class="col-12 uri-only-edit d-none">
                  <label class="form-label" for="vdf_uri">URI / Punto de acceso</label>
                  <input id="vdf_uri" class="form-control" placeholder="https://api.example.com/ingest">
                </div>

                <div class="col-12">
                  <label class="form-label" for="vdf_options_json">Opciones (JSON)</label>
                  <textarea id="vdf_options_json" class="form-control" rows="6" placeholder='{"headers":{"Authorization":"Bearer ..."}}'></textarea>
                </div>
              </div>

              <div class="mt-3 d-flex justify-content-end">
                <button type="submit" class="btn btn-primary" id="vdf_saveBtn">
                  <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                  Guardar cambios
                </button>
              </div>
            </form>
          </div>
        </div> <!-- /tab-content -->
      </div>
    </div>
  </div>
</div>
